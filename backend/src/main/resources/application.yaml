spring:
  application:
    name: find-my-coach
  datasource:
    # File-based H2 so data survives restarts. Override with SPRING_DATASOURCE_URL
    # (e.g. jdbc:h2:mem:findmycoach) for a throwaway database.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/findmycoach;MODE=LEGACY;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

app:
  # Comma separated list of origins allowed to call the API from a browser.
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}
  # Business time zone used for "today", slot start times and cancellation rules.
  time-zone: ${APP_TIME_ZONE:Europe/London}
  seed-demo-data: ${APP_SEED_DEMO_DATA:true}
  jwt:
    # HS256 secret, at least 32 characters. ALWAYS override in any shared environment.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    issuer: find-my-coach
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:PT1H}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:P30D}
  booking:
    # How far ahead trainees can book (days, inclusive of today).
    booking-window-days: ${APP_BOOKING_WINDOW_DAYS:60}
    # Max range accepted by availability endpoints.
    max-availability-range-days: 31
    # Trainees can cancel without being flagged as a late cancellation up to this many hours before.
    free-cancellation-hours: 24

server:
  port: ${PORT:8081}
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
